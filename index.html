<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="icon" href="img1.webp" type="image/" />
  </head>
  <body>
    <div class="container">
      <div class="graphic-container"></div>
      <div class="blackBar">
        <span id="hrs">00</span>
        <span>:</span>
        <span id="mins">00</span>
        <span>:</span>
        <span id="secs">00</span>
        <div class="whiteLine"></div>
      </div>
      <div class="earContainer">
        <div class="rabitEar1">
          <div class="rabitEar01"></div>
        </div>
        <div class="rabitEar2">
          <div class="rabitEar02"></div>
        </div>
      </div>
      <div class="stand-container">
        <div class="stand1"></div>
        <div class="stand2"></div>
      </div>
    </div>
    <h1>Renuka Luwang</h1>

    <div class="cuboidA">
      <div class="face top">
        <img src="img1.webp" alt="Image" />
      </div>
      <div class="face front">
        <img src="img5.jpg" alt="Image" />
      </div>
      <div class="face sides">
        <img src="img4.jpg" alt="Image" />
      </div>
    </div>
    <div class="cuboidB">
      <div class="face top">
        <img src="img4.jpg" alt="Image" />
      </div>
      <div class="face front">
        <img src="img1.webp" alt="Image" />
      </div>
      <div class="face sides">
        <img src="img5.jpg" alt="Image" />
      </div>
    </div>
    <div class="cuboidC">
      <div class="face top">
        <img src="img5.jpg" alt="Image" />
      </div>
      <div class="face front">
        <img src="img4.jpg" alt="Image" />
      </div>
      <div class="face sides">
        <img src="img1.webp" alt="Image" />
      </div>
    </div>

    <!--  -->
    <div class="cuboid1">
      <div class="faces tops">
        <img src="img6.webp" alt="Image" />
      </div>
      <div class="faces fronts">
        <img src="img3.webp" alt="Image" />
      </div>
      <div class="faces sidess">
        <img src="img2.jpg" alt="Image" />
      </div>
    </div>
    <div class="cuboid2">
      <div class="faces tops">
        <img src="img2.jpg" alt="Image" />
      </div>
      <div class="faces fronts">
        <img src="img6.webp" alt="Image" />
      </div>
      <div class="faces sidess">
        <img src="img3.webp" alt="Image" />
      </div>
    </div>
    <div class="cuboid3">
      <div class="faces tops">
        <img src="img3.webp" alt="Image" />
      </div>
      <div class="faces fronts">
        <img src="img2.jpg" alt="Image" />
      </div>
      <div class="faces sidess">
        <img src="img6.webp" alt="Image" />
      </div>
    </div>
    <div class="icon">
      <span class="material-icons" id="play"> play_arrow </span>
      <span class="material-icons" id="pause"> pause_circle</span>
    </div>
    <audio controls loop>
      <source src="Audio.mp3" />
    </audio>

    <script id="tick" src="power.js"></script>
  </body>
</html>
